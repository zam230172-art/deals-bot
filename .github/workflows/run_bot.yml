name: Deals Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python deals_bot.py

      - name: Save sent deals
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Deals Bot"
          git add sent_deals.json
          git diff --staged --quiet || git commit -m "Update sent deals"
          git push
